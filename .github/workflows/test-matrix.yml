name: Python Test Matrix

on:
  push:
    paths:
      - 'webnovel-writer/scripts/**'
      - 'webnovel-writer/skills/**'
      - 'webnovel-writer/agents/**'
      - 'webnovel-writer/evals/**'
      - 'webnovel-writer/references/**'
      - 'webnovel-writer/templates/**'
      - 'webnovel-writer/dashboard/**'
      - 'webnovel-writer/.claude-plugin/**'
      - '.claude-plugin/**'
      - 'docs/**'
      - 'README.md'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/test-matrix.yml'
  pull_request:
    paths:
      - 'webnovel-writer/scripts/**'
      - 'webnovel-writer/skills/**'
      - 'webnovel-writer/agents/**'
      - 'webnovel-writer/evals/**'
      - 'webnovel-writer/references/**'
      - 'webnovel-writer/templates/**'
      - 'webnovel-writer/dashboard/**'
      - 'webnovel-writer/.claude-plugin/**'
      - '.claude-plugin/**'
      - 'docs/**'
      - 'README.md'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/test-matrix.yml'

jobs:
  pytest:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        # 最低支持版本为 3.12（见 scripts/requirements.txt）；不再测试 3.10/3.11。
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest (Linux)
        if: runner.os != 'Windows'
        run: python -X utf8 -m pytest --no-cov

      - name: Run pytest with temporary directory precheck (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./webnovel-writer/scripts/run_tests.ps1 -Mode full

  # 行为评测与包校验独立成 job：不再挂在某个矩阵 job 之后。
  # 原先它们的 if 条件绑在 ubuntu+3.11 上，而那个 job 在 pytest 步就失败，
  # 导致这两步在 CI 里从未真正执行过。
  quality:
    name: Behavior evals & package validation
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run behavior evals
        run: python webnovel-writer/scripts/run_behavior_evals.py --format text

      - name: Validate plugin package
        run: python webnovel-writer/scripts/validate_plugin_package.py --format text
